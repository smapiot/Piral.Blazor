name: Build and Publish

on:
  push:
    branches:
      - 'blazor-*'
    tags:
      - 'v*'

env:
  BUILD_CONFIGURATION: Release

permissions:
  contents: read
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install .NET 9 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.x

      - name: Build Assemblies (Pre)
        if: startsWith(github.ref, 'refs/heads/blazor-')
        run: |
          dotnet build ./src/Piral.Blazor.Core --configuration $BUILD_CONFIGURATION --version-suffix pre.${{ github.run_number }}
          dotnet build ./src/Piral.Blazor.Utils --configuration $BUILD_CONFIGURATION --version-suffix pre.${{ github.run_number }}
          dotnet build ./src/Piral.Blazor.Analyzer --configuration $BUILD_CONFIGURATION --version-suffix pre.${{ github.run_number }}
          dotnet build ./src/Piral.Blazor.Tools --configuration $BUILD_CONFIGURATION --version-suffix pre.${{ github.run_number }}
          dotnet build ./src/Piral.Blazor.DevServer --configuration $BUILD_CONFIGURATION --version-suffix pre.${{ github.run_number }}

      - name: Build Assemblies
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          dotnet build ./src/Piral.Blazor.Core --configuration $BUILD_CONFIGURATION
          dotnet build ./src/Piral.Blazor.Utils --configuration $BUILD_CONFIGURATION
          dotnet build ./src/Piral.Blazor.Analyzer --configuration $BUILD_CONFIGURATION
          dotnet build ./src/Piral.Blazor.Tools --configuration $BUILD_CONFIGURATION
          dotnet build ./src/Piral.Blazor.DevServer --configuration $BUILD_CONFIGURATION

      - name: Change GAC
        run: |
          rm ~/.nuget/packages/microsoft.aspnetcore.components/9.0.13/lib/net9.0/Microsoft.AspNetCore.Components.dll
          cp tools/Microsoft.AspNetCore.Components.dll ~/.nuget/packages/microsoft.aspnetcore.components/9.0.13/lib/net9.0/Microsoft.AspNetCore.Components.dll

      - name: Run Tests
        run: |
          dotnet build tests
          dotnet test tests

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Prepare NPM Package
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          cd ./src/Piral.Blazor.Core

          TARGET_VERSION=$(node -e 'console.log(require("./obj/project.assets.json").project.version)')

          dotnet build -c Release
          dotnet publish -c Release --output ../../dist/release

          dotnet build -c Debug
          dotnet publish -c Debug --output ../../dist/debug -p:CopyOutputSymbolsToPublishDirectory=true

          cd ../../dist

          cp ../template/* .
          cp ../LICENSE .

          npm version "$TARGET_VERSION"

          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" >> ~/.npmrc
          echo "always-auth=true" >> ~/.npmrc

          cd ..

      - name: Publish Pre-Package on NPM
        if: startsWith(github.ref, 'refs/heads/blazor-')
        run: |
          cd dist

          sed -i -e 's/\("version":\s*"\([0-9]\+\.\?\)\+\)/\1-pre.${{ github.run_number }}/' package.json

          npm publish --tag next --provenance

      - name: Publish Package on NPM
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          cd dist
          npm publish --tag latest --provenance

      - name: Reset Output
        run: rm -rf dist

      - name: Pack Assemblies (Pre)
        if: startsWith(github.ref, 'refs/heads/blazor-')
        run: |
          dotnet pack ./src/Piral.Blazor.Core --configuration $BUILD_CONFIGURATION --version-suffix pre.${{ github.run_number }} --output ./dist
          dotnet pack ./src/Piral.Blazor.Utils --configuration $BUILD_CONFIGURATION --version-suffix pre.${{ github.run_number }} --output ./dist
          dotnet pack ./src/Piral.Blazor.Template --configuration $BUILD_CONFIGURATION --version-suffix pre.${{ github.run_number }} --output ./dist
          dotnet pack ./src/Piral.Blazor.Analyzer --configuration $BUILD_CONFIGURATION --version-suffix pre.${{ github.run_number }} --output ./dist
          dotnet pack ./src/Piral.Blazor.Tools --configuration $BUILD_CONFIGURATION --version-suffix pre.${{ github.run_number }} --output ./dist
          dotnet pack ./src/Piral.Blazor.DevServer --configuration $BUILD_CONFIGURATION --version-suffix pre.${{ github.run_number }} --output ./dist

      - name: Pack Assemblies
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          dotnet pack ./src/Piral.Blazor.Core --configuration $BUILD_CONFIGURATION --output ./dist
          dotnet pack ./src/Piral.Blazor.Utils --configuration $BUILD_CONFIGURATION --output ./dist
          dotnet pack ./src/Piral.Blazor.Template --configuration $BUILD_CONFIGURATION --output ./dist
          dotnet pack ./src/Piral.Blazor.Analyzer --configuration $BUILD_CONFIGURATION --output ./dist
          dotnet pack ./src/Piral.Blazor.Tools --configuration $BUILD_CONFIGURATION --output ./dist
          dotnet pack ./src/Piral.Blazor.DevServer --configuration $BUILD_CONFIGURATION --output ./dist

      - name: Install Mono
        run: |
          sudo apt-get update
          sudo apt-get install -y mono-complete

      - name: NuGet Login (OIDC)
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish Packages on NuGet
        run: |
          dotnet nuget push "dist/*.nupkg" \
            --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
